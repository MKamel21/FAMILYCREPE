<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FC Family Crêpe – Espace gérant</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,700;1,800&family=Caveat:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a100b; --bg2:#24160f; --card:#2d1c13; --line:#4a3022;
  --text:#f6ece2; --muted:#c9b3a2; --red:#d3242a; --red2:#a8151b;
  --gold:#f2a33a; --cream:#fbf3e8; --ok:#3fae6a;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 2px,transparent 2px 70px),radial-gradient(1200px 600px at 50% -10%,#3a2216 0,transparent 70%)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:'Playfair Display',serif}
.hand{font-family:'Caveat',cursive;color:var(--gold)}
.logo{border-radius:50%;display:block;box-shadow:0 6px 22px rgba(0,0,0,.45)}

/* Header */
header{position:sticky;top:0;z-index:30;background:rgba(26,16,11,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}
.brand b{font-family:'Playfair Display',serif;font-size:18px}
.nav a{color:var(--muted);text-decoration:none;font-size:15px}
.nav .links{display:flex;gap:22px}
.cartbtn{background:var(--red);padding:9px 16px;border-radius:999px;font-weight:700;display:flex;gap:8px;align-items:center}
.cartbtn span{background:#fff;color:var(--red);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:13px}
@media(max-width:700px){.nav .links{display:none}}

/* Hero */
.hero{padding:48px 0 36px;display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center}
.hero h1{font-size:clamp(38px,6vw,62px);line-height:1.05}
.hero .hand{font-size:32px}
.hero p.lead{max-width:520px;margin:14px 0 24px;color:var(--muted);font-size:17px}
.hero-vis{position:relative;height:340px}
.hero-vis svg{position:absolute;height:280px;filter:drop-shadow(0 18px 24px rgba(0,0,0,.5))}
.hero-vis .a{left:0;top:40px;transform:rotate(-10deg)}
.hero-vis .b{left:30%;top:0;height:320px;z-index:2}
.hero-vis .c{right:0;top:50px;transform:rotate(9deg)}
@media(max-width:760px){.hero{grid-template-columns:1fr;text-align:center}.hero p.lead{margin-inline:auto}.hero-vis{height:260px;order:-1}.hero-vis svg{height:210px}.hero-vis .b{height:250px;left:calc(50% - 115px)}.hero-vis .a{left:-10px}.hero-vis .c{right:-10px}.hero .infos{justify-content:center}}
.cta{display:inline-block;background:var(--red);color:#fff;padding:14px 28px;border-radius:999px;font-weight:700;text-decoration:none;box-shadow:0 8px 24px rgba(211,36,42,.35)}
.infos{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.pill{border:1px solid var(--line);background:var(--bg2);padding:8px 14px;border-radius:999px;font-size:14px;color:var(--muted)}
.pill a{color:var(--text);text-decoration:none}

/* Menu */
section{padding:28px 0}
.sec-title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sec-title h2{font-size:30px;background:linear-gradient(90deg,var(--gold),#ffcf86);color:#2a160c;padding:2px 16px;transform:skew(-6deg);border-radius:4px}
.sec-title .hand{font-size:24px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;position:sticky;top:64px;z-index:20;background:var(--bg);padding-top:10px}
.tab{white-space:nowrap;border:1px solid var(--line);padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:500}
.tab.on{background:var(--cream);color:#2a160c;border-color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;transition:.2s;overflow:hidden;cursor:pointer}
.item:hover{border-color:var(--gold);transform:translateY(-3px)}
.vis{height:210px;margin:-16px -16px 6px;display:grid;place-items:center;background:radial-gradient(circle at 50% 62%,#5a331d 0,#3a2216 45%,#2d1c13 75%);position:relative}
.vis::after{content:"";position:absolute;inset:auto 0 0;height:40px;background:linear-gradient(transparent,var(--card))}
.vis svg{height:200px;transition:transform .35s;filter:drop-shadow(0 12px 16px rgba(0,0,0,.45))}
.item:hover .vis svg{transform:scale(1.06) rotate(-3deg)}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.item h3{font-size:21px;letter-spacing:.02em}
.price{background:var(--red);color:#fff;border-radius:999px;padding:3px 11px;font-weight:700;font-size:14px;white-space:nowrap}
.item p{color:var(--muted);font-size:14px;flex:1}
.add{align-self:flex-start;background:var(--cream);color:#2a160c;font-weight:700;padding:8px 14px;border-radius:999px;font-size:14px}
.tag{font-size:12px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.steam{animation:steam 2.8s ease-in-out infinite}
@keyframes steam{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:.9;transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.steam{animation:none}}

.student{background:linear-gradient(135deg,#3a1a10,#5a1d14);border:1px solid var(--gold);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:center}
.student svg{width:100%;height:auto;filter:drop-shadow(0 12px 16px rgba(0,0,0,.45))}
.student h3{font-size:26px}
.student .big{font-family:'Playfair Display',serif;font-size:38px;font-weight:800;color:#fff}
@media(max-width:700px){.student{grid-template-columns:1fr}.student svg{max-width:280px;margin:auto;display:block}}
.warn{background:rgba(242,163,58,.12);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--text)}
.warn b{color:var(--gold)}
.sauces{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* About */
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.about .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
@media(max-width:700px){.about{grid-template-columns:1fr}}

footer{border-top:1px solid var(--line);padding:30px 0 100px;color:var(--muted);font-size:14px;text-align:center}
footer button{color:var(--muted);text-decoration:underline;font-size:13px;margin-top:10px}

/* Modal & drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
@media(min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--bg2);border:1px solid var(--line);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px}
@media(min-width:700px){.sheet{border-radius:20px}}
.sheet h3{font-size:26px}
.sheet .x{float:right;font-size:26px;color:var(--muted);line-height:1;position:relative;z-index:2}
.mvis{height:220px;margin:-22px -22px 10px;display:grid;place-items:center;background:radial-gradient(circle at 50% 62%,#5a331d 0,#3a2216 45%,var(--bg2) 78%)}
.mvis svg{height:210px;filter:drop-shadow(0 12px 16px rgba(0,0,0,.45))}
.grp{margin-top:18px}
.grp h4{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:8px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer;gap:10px}
.opt:has(input:checked){border-color:var(--gold);background:rgba(242,163,58,.08)}
.opt input{accent-color:var(--red);width:18px;height:18px;flex:none}
.opt label{display:flex;gap:10px;align-items:center;flex:1;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:14px;color:var(--text)}
.chip.off{background:rgba(211,36,42,.15);border-color:var(--red);text-decoration:line-through;color:#ffb3b3}
textarea,input[type=text],input[type=tel],input[type=password],input[type=number],input[type=time],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--gold)}
textarea{min-height:70px;resize:vertical}
.foot{display:flex;gap:10px;align-items:center;margin-top:20px;position:sticky;bottom:-22px;background:var(--bg2);padding:12px 0}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{width:38px;height:40px;font-size:20px}
.qty span{min-width:22px;text-align:center;font-weight:700}
.primary{flex:1;background:var(--red);color:#fff;font-weight:700;padding:12px;border-radius:999px;font-size:16px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.line small{display:block;color:var(--muted)}
.line .rm{color:#ff9b9b;font-size:13px;margin-top:4px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:20px;margin-top:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{margin-top:10px}
.field label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);padding:10px;border-radius:12px;line-height:1.25}
.seg button small{display:block;font-size:12px;font-weight:400;opacity:.8}
.seg button.on{background:var(--cream);color:#2a160c;border-color:var(--cream);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.slot{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-weight:700;font-size:15px}
.slot small{display:block;font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.slot.full{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.slot.on{background:var(--cream);color:#2a160c;border-color:var(--cream)}
.slot.on small{color:#6b4a33}
.daylbl{grid-column:1/-1;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.floatcart{position:fixed;left:16px;right:16px;bottom:16px;z-index:40;display:none}
.floatcart button{width:100%;background:var(--red);color:#fff;padding:15px;border-radius:999px;font-weight:700;display:flex;justify-content:space-between;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@media(max-width:700px){.floatcart.show{display:block}}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--cream);color:#2a160c;padding:10px 18px;border-radius:999px;font-weight:700;z-index:80;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}

.payopt{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.payopt.on{border-color:var(--gold);background:rgba(242,163,58,.08)}
.payopt .pt{font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.payopt .pd{color:var(--muted);font-size:13px;margin-top:4px}
.paylogos{font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.bignum{font-family:'Playfair Display',serif;font-size:64px;font-weight:800;line-height:1;margin:6px 0 14px;letter-spacing:.04em}
/* Horaires */
.hours{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:560px}
.hours .row{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.hours .row:last-child{border-bottom:0}
.hours .row b{font-weight:700}
.hours .row span{color:var(--gold);font-weight:700;text-align:right}
.hours .row.closed span{color:#ff8a8a}
.hours .row.today{background:rgba(242,163,58,.1)}
/* Admin */
.pindots{display:flex;gap:16px;justify-content:center;margin:18px 0 4px}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold)}
.pindots i.on{background:var(--gold)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.keypad button{height:62px;border-radius:16px;background:var(--bg);border:1px solid var(--line);font-size:24px;font-weight:700}
.keypad button:active{background:var(--line)}
.keypad .k-alt{font-size:15px;color:var(--muted)}
.keypad button:disabled{opacity:.35;cursor:not-allowed}
.stay{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:16px;color:var(--muted);font-size:14px}
.stay input{accent-color:var(--red);width:18px;height:18px}
#admin{display:none;min-height:100vh}
body.is-admin #site{display:none}
body.is-admin #admin{display:block}
.login{max-width:400px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center}
.steps{display:flex;gap:6px;justify-content:center;margin:14px 0}
.steps i{width:30px;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:var(--gold)}
.pinbox{display:flex;gap:8px;justify-content:center;margin:16px 0}
.pinbox input{width:52px;height:60px;text-align:center;font-size:26px;font-weight:700;padding:0}
.err{color:#ff8a8a;font-size:14px;min-height:20px;margin-top:6px}
.dash-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:18px 0}
.dash-head .btns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-size:26px;font-family:'Playfair Display',serif;display:block}
.stat span{color:var(--muted);font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.order{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.order.new{border-color:var(--red);box-shadow:0 0 0 2px rgba(211,36,42,.3)}
.order .oh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.order .num{font-family:'Playfair Display',serif;font-size:24px;font-weight:800}
.pickup{display:inline-block;background:var(--cream);color:#2a160c;font-weight:800;border-radius:10px;padding:4px 10px;font-size:18px;margin-top:6px}
.st{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
.st-nouvelle{background:var(--red);color:#fff}
.st-preparation{background:var(--gold);color:#2a160c}
.st-prete{background:var(--ok);color:#fff}
.st-attente_paiement{background:#7b4fd6;color:#fff}
.st-annulee{background:#3a2a24;color:#ff9b9b}
.paid{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(63,174,106,.18);color:#7fe0a5}
.unpaid{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(123,79,214,.22);color:#c9b2ff}
.order.cash{border-color:#7b4fd6;box-shadow:0 0 0 2px rgba(123,79,214,.3)}
.cashbox{background:rgba(123,79,214,.14);border:1px solid #7b4fd6;border-radius:12px;padding:12px;margin-top:10px}
.cashbox b.amt{font-size:26px;font-family:"Playfair Display",serif}
.search{display:flex;gap:8px;margin-bottom:14px}
.search input{font-size:20px;font-weight:700;letter-spacing:.1em}
.search input::placeholder{font-size:15px;font-weight:500;letter-spacing:0}
.order.hit{outline:3px solid var(--gold)}
.st-terminee{background:var(--line);color:var(--muted)}
.order ul{list-style:none;margin:12px 0;border-top:1px dashed var(--line)}
.order li{padding:8px 0;border-bottom:1px dashed var(--line)}
.order li .d{color:var(--muted);font-size:14px}
.order li .rm{color:#ff9b9b;font-size:14px;font-weight:700}
.order .note{background:rgba(242,163,58,.12);border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;margin-top:8px;font-size:14px}
.order .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.order .acts button{border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:14px}
.order .acts button.go{background:var(--cream);color:#2a160c;border-color:var(--cream);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px}
</style>
</head>
<body class="is-admin">
<div id="admin"><div class="wrap" id="adminRoot"></div></div>

/* ============================================================
   CONNEXION AU SERVEUR (Netlify Functions + Netlify Blobs)
   Les commandes sont enregistrées en ligne : elles arrivent sur
   n'importe quel appareil du gérant.
   ============================================================ */
let CFG={cap:3,open:'11:00',close:'22:00',step:10}, ONLINE_PAY=false;
const TOKEN_KEY='fc_admin_token';
function token(){try{return sessionStorage.getItem(TOKEN_KEY)||localStorage.getItem(TOKEN_KEY)}catch(e){return null}}
async function api(path,{method='GET',body,auth}={}){
  const h={'Content-Type':'application/json'};
  if(auth){const t=token(); if(t)h.Authorization='Bearer '+t}
  let r;
  try{ r=await fetch('/api'+path,{method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'}) }
  catch(e){ throw Object.assign(new Error('Pas de connexion internet. Réessaie.'),{status:0}) }
  let j={}; try{j=await r.json()}catch(e){}
  if(!r.ok) throw Object.assign(new Error(j.error||('Erreur '+r.status)),{status:r.status,data:j});
  return j;
}

function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const hhmm=t=>new Date(t).toTimeString().slice(0,5);

/* ============================================================
   CRÉNEAUX DE RETRAIT
   - Une crêpe prend 5 à 10 min → on raisonne par tranches de 10 min.
   - Chaque tranche a une capacité (par défaut 3 crêpes).
   - Une commande remplit sa tranche de retrait, puis les tranches
     précédentes si elle a trop de crêpes.
   - Si les commandes déjà en cours remplissent un créneau, il est
     affiché "complet" et le client prend le suivant (10/20 min plus tard).
   ============================================================ */
function cfg(){return CFG}
function crepesOf(items){return items.reduce((s,i)=>s+i.qty*({etudiant:2,shake:0}[i.type]??1),0)}
function at(day,t){const[h,m]=t.split(':').map(Number);const d=new Date(day);d.setHours(h,m,0,0);return d.getTime()}
async function buildSlots(need){
  const data=await api('/disponibilites'); CFG=data.cfg; ONLINE_PAY=data.paymentsEnabled;
  const c=CFG,st=c.step*60000,now=Date.now(),load={};
  const first=Math.ceil((now+st)/st)*st;               // minimum ~10 min pour préparer
  data.busy.forEach(o=>{
    let rem=o.crepes,t=o.pickup,k=0;
    while(rem>0&&k++<40){const tk=Math.min(Math.max(0,c.cap-(load[t]||0)),rem);load[t]=(load[t]||0)+tk;rem-=tk;t-=st}
  });
  const out=[];
  const hours=c.hours||DEF_HOURS;
  for(let day=0;day<3&&out.length<80;day++){
    const d=new Date();d.setDate(d.getDate()+day);
    const label=day===0?"Aujourd'hui":day===1?'Demain':cap1(JOURS[d.getDay()]);
    for(const [o,cl] of (hours[d.getDay()]||[])){              // ex. midi puis soir
      const open=at(d,o)+st,close=at(d,cl);
      for(let t=open;t<=close&&out.length<80;t+=st){
        if(t<first)continue;
        let rem=need,u=t;
        while(rem>0&&u>=Math.max(first,open)){rem-=Math.max(0,c.cap-(load[u]||0));u-=st}
        out.push({t,day:label,ok:rem<=0&&(c.cap-(load[t]||0))>0});   // le créneau lui-même doit avoir de la place
      }
    }
  }
  return out;
}

function pinKey(k){
  if(pinBusy||lockUntil>Date.now())return;
  const stay=$('#stay')?.checked;
  if(k==='C')pinBuf=''; else if(k==='<')pinBuf=pinBuf.slice(0,-1); else if(pinBuf.length<4)pinBuf+=k;
  drawLogin(); if($('#stay'))$('#stay').checked=!!stay;
  if(pinBuf.length===4) setTimeout(()=>checkPin(stay),120);
}
document.addEventListener('keydown',e=>{
  if(logged||inSettings)return;
  if(/^\d$/.test(e.key))pinKey(e.key); else if(e.key==='Backspace')pinKey('<');
});
async function checkPin(stay){
  pinBusy=true; const pin=pinBuf; pinBuf='';
  try{
    const r=await api('/gerant/connexion',{method:'POST',body:{pin,stay:!!stay}});
    try{ (stay?localStorage:sessionStorage).setItem(TOKEN_KEY,r.token) }catch(e){}

    if('Notification' in window && Notification.permission==='default') Notification.requestPermission();
    drawDash();

    pinBusy=false; if(e.data&&e.data.until) lockUntil=e.data.until;

  }
}
function logout(){logged=false;LAST=[];try{sessionStorage.removeItem(TOKEN_KEY);localStorage.removeItem(TOKEN_KEY)}catch(e){};drawLogin()}

/* ------------------------------------------------------------
   SON "KA-CHING" (caisse enregistreuse), généré sans fichier audio.
   Joué 2 fois à chaque nouvelle commande.
   ------------------------------------------------------------ */
let AC=null, master=null;
function audio(){
  if(!AC){
    const A=window.AudioContext||window.webkitAudioContext; if(!A)return null;
    AC=new A(); const comp=AC.createDynamicsCompressor();
    comp.threshold.value=-18; comp.ratio.value=6;
    master=AC.createGain(); master.gain.value=0.8; master.connect(comp); comp.connect(AC.destination);
  }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
document.addEventListener('pointerdown',()=>{audio();setTimeout(()=>{const b=$('#soundOff');if(b&&soundReady())b.remove()},150)},{passive:true});
function kaching(ac=audio(),out=master,t0){
  if(!ac)return; const t=t0??ac.currentTime+0.02;
  // 1) "ka" : clic métallique du tiroir (bruit filtré très court)
  const len=Math.floor(ac.sampleRate*0.07), buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const n=ac.createBufferSource(); n.buffer=buf;
  const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=1.2;
  const ng=ac.createGain(); ng.gain.value=1.6; n.connect(bp); bp.connect(ng); ng.connect(out); n.start(t);
  // petit "tac" grave du tiroir
  const k=ac.createOscillator(), kg=ac.createGain(); k.type='triangle';
  k.frequency.setValueAtTime(420,t); k.frequency.exponentialRampToValueAtTime(140,t+0.06);
  kg.gain.setValueAtTime(0.8,t); kg.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  k.connect(kg); kg.connect(out); k.start(t); k.stop(t+0.1);
  // 2) "ching" : cloche (partiels inharmoniques) x2 légèrement désaccordées
  const bell=(f,start,vol)=>{
    [[1,1],[2.76,.55],[5.4,.32],[8.93,.18],[13.3,.08]].forEach(([m,a])=>{
      const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=f*m;
      const dur=1.6/Math.sqrt(m);
      g.gain.setValueAtTime(0,start); g.gain.linearRampToValueAtTime(vol*a,start+0.004);
      g.gain.exponentialRampToValueAtTime(0.0008,start+dur);
      o.connect(g); g.connect(out); o.start(start); o.stop(start+dur+0.05);
    });
  };
  bell(1975,t+0.09,0.42); bell(1990,t+0.09,0.3); bell(2637,t+0.16,0.32);
}
function beep(){kaching()}

}
async function checkNew(){

  firstLoad=false; drawDash(all);
}

    <div class="brand"><img class="logo" src="${FC_LOGO}" width="44" height="44"><div><b>Commandes</b><div style="color:var(--muted);font-size:13px">Mise à jour automatique · ${'Notification' in window?(Notification.permission==='granted'?'🔔 notifications activées':'<button style="color:var(--gold);text-decoration:underline" onclick="Notification.requestPermission().then(()=>drawDash())">activer les notifications</button>'):''}</div></div></div>
    <div class="btns"><button class="ghost" onclick="beep()">🔊 Tester le son</button><button class="ghost" onclick="drawSettings()">Réglages</button><button class="ghost" onclick="logout()">Déconnexion</button><a class="ghost" href="/" target="_blank" style="color:inherit;text-decoration:none">Voir le site</a></div>
  </div>
  ${soundReady()?'':`<button id="soundOff" class="warn" style="width:100%;margin-bottom:12px;text-align:left;cursor:pointer">🔇 <b>Touche ici pour activer le son des commandes.</b> Le navigateur bloque le son tant que l'écran n'a pas été touché.</button>`}
  <div class="stats">
    <div class="stat"><b>${all.filter(o=>o.status==='attente_paiement').length}</b><span>💶 À encaisser</span></div>
    <div class="stat"><b>${all.filter(o=>o.status==='nouvelle').length}</b><span>Nouvelles (payées)</span></div>
    <div class="stat"><b>${all.filter(o=>o.status==='preparation').length}</b><span>En préparation</span></div>
    <div class="stat"><b>${todays.filter(isPaid).length}</b><span>Payées aujourd'hui</span></div>
    <div class="stat"><b>${eur(todays.filter(isPaid).reduce((s,o)=>s+o.total,0))}</b><span>Encaissé aujourd'hui</span></div>
  </div>
  <p style="color:var(--muted);font-size:13px;margin-bottom:10px">Capacité : ${c.cap} crêpes par tranche de ${c.step} min · aujourd'hui : ${rangesTxt((c.hours||DEF_HOURS)[new Date().getDay()])}. Les commandes en cours sont triées par heure de retrait. · Paiement en ligne : ${PAY_ON?'<b style="color:#7fe0a5">actif (SumUp)</b>':'<b>non configuré</b>'}</p>
  <div class="search"><input type="text" inputmode="numeric" id="qNum" placeholder="🔎 N° de commande du client" value="${esc(q)}" oninput="q=this.value.trim();drawDash().then(()=>{const i=$('#qNum');i.focus();i.setSelectionRange(i.value.length,i.value.length)})">${q?`<button class="ghost" onclick="q='';drawDash()">Effacer</button>`:''}</div>
  <div class="filters seg" style="flex-wrap:wrap">${[['actives','En cours'],['attente_paiement','💶 À encaisser'],['nouvelle','Nouvelles'],['preparation','En préparation'],['prete','Prêtes'],['terminee','Terminées'],['annulee','Annulées'],['toutes','Toutes']].map(([k,l])=>`<button class="${filter===k?'on':''}" onclick="filter='${k}';drawDash()">${l}</button>`).join('')}</div>
  ${list.length?list.map(o=>orderCard(o,!!q)).join(''):(q?`<div class="empty">Aucune commande n° ${esc(q)}.</div>`:'<div class="empty">Aucune commande ici pour le moment.<br>Les nouvelles commandes apparaissent automatiquement avec une alerte sonore.</div>')}`;
  window.scrollTo(0,scrollY);
}
function orderCard(o,hit=false){
  const d=new Date(o.createdAt), c=o.customer, nx=NEXT[o.status], stu=o.student||hasStudent(o.items);
  const pay=o.payment||{method:'cash',paid:o.status!=='attente_paiement'}, waiting=o.status==='attente_paiement';
  const payBadge=pay.paid?`<span class="paid">${pay.method==='card'?'💳 Payée en ligne':'💶 Payée en liquide'}</span>`:`<span class="unpaid">💶 Non payée</span>`;
  return `<div class="order ${waiting?'cash':o.status==='nouvelle'?'new':''} ${hit?'hit':''}">
    <div class="oh"><div><span class="num">N° ${o.num}</span> <span class="st st-${o.status}">${STATUS[o.status]}</span> ${payBadge}
      <div>${o.pickup?`<span class="pickup">⏰ Retrait ${fmtPickup(o.pickup)}</span>`:waiting?`<span style="color:var(--muted);font-size:14px">⏳ Le client vient payer au comptoir</span>`:''}</div>
      <div style="color:var(--muted);font-size:13px;margin-top:4px">Passée le ${d.toLocaleDateString('fr-BE')} à ${hhmm(d)} · ${crepesOf(o.items)} crêpe(s)</div></div>
      <div style="text-align:right"><div style="font-size:22px;font-weight:700">${eur(o.total)}</div></div></div>
    ${waiting?`<div class="cashbox">À encaisser en liquide : <b class="amt">${eur(o.total)}</b>${stu?'<br><span style="font-size:13px">🎓 Vérifier la carte étudiante avant d\'encaisser (sinon prix normal).</span>':''}</div>`:''}
    <div style="margin-top:10px">${c.mode==='surplace'?'🍽️ <b>SUR PLACE</b>':'🥡 <b>À EMPORTER</b>'} · ${esc(c.name)} · <a style="color:var(--gold)" href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>
    ${stu&&!waiting?`<div class="warn" style="margin-top:10px">🎓 <b>Menu étudiant : vérifier la carte étudiante avant de servir.</b> Sans carte valide, l'offre n'est pas applicable (prix normal).</div>`:''}
    <ul>${o.items.map(i=>`<li><b>${i.qty}× ${esc(i.name)}</b> <span style="float:right">${eur(i.unit*i.qty)}</span>
      ${i.options.length?`<div class="d">${i.options.map(esc).join(' · ')}</div>`:''}
      ${i.removed.length?`<div class="rm">✗ SANS : ${esc(i.removed.join(', '))}</div>`:''}
      ${i.note?`<div class="d">📝 ${esc(i.note)}</div>`:''}</li>`).join('')}</ul>
    ${o.note?`<div class="note"><b>Remarque du client :</b> ${esc(o.note)}</div>`:''}
    <div class="acts">
      ${waiting?`<button class="go" onclick="setPaid('${o.id}')">✅ Paiement reçu : lancer la préparation</button><button onclick="cancelOrder('${o.id}')">Annuler (non payée)</button>`
      :`${nx?`<button class="go" onclick="setStatus('${o.id}','${nx[0]}')">${nx[1]}</button>`:''}
      ${['terminee','annulee'].includes(o.status)?`<button onclick="setStatus('${o.id}','${pay.paid?'nouvelle':'attente_paiement'}')">Rouvrir</button>`:`<button onclick="setStatus('${o.id}','terminee')">Clôturer</button>`}`}
      <button onclick="printOrder('${o.id}')">🖨️ Imprimer</button>
    </div></div>`;
}
async function setPaid(id){
  const o=await act(id,{action:'encaisser'});
  if(o){ q=''; toast('Payée ✓ · prête vers '+hhmm(o.pickup)); }
  drawDash();
}
async function cancelOrder(id){
  if(!confirm('Annuler cette commande non payée ?'))return;
  await act(id,{action:'statut',status:'annulee'}); drawDash();
}
async function setStatus(id,s){await act(id,{action:'statut',status:s});drawDash()}
async function printOrder(id){
  const o=LAST.find(x=>x.id===id);if(!o)return;const w=window.open('','_blank','width=380,height=600');if(!w)return;
  const txt=`FAMILY CRÊPE — N° ${o.num}\nRETRAIT : ${o.pickup?fmtPickup(o.pickup):'-'}\n${(MODES[o.customer.mode]||'').toUpperCase()}\n${o.customer.name} · ${o.customer.phone}\n${o.payment&&o.payment.paid?(o.payment.method==='card'?'PAYÉE EN LIGNE':'PAYÉE EN LIQUIDE'):'NON PAYÉE - À ENCAISSER'}\n${o.student?'** MENU ÉTUDIANT : VÉRIFIER LA CARTE **\n':''}------------------------\n${o.items.map(i=>`${i.qty}x ${i.name}  ${eur(i.unit*i.qty)}${i.options.map(x=>'\n  + '+x).join('')}${i.removed.length?'\n  SANS: '+i.removed.join(', '):''}${i.note?'\n  NOTE: '+i.note:''}`).join('\n')}\n------------------------\n${o.note?'REMARQUE: '+o.note+'\n':''}TOTAL: ${eur(o.total)}`;
  w.document.write('<pre style="font:14px monospace;white-space:pre-wrap">'+esc(txt)+'</pre>');
  w.document.close();w.print();
}
function drawSettings(){
  ++VIEW; inSettings=true; const c=cfg();
  $('#adminRoot').innerHTML=`<div class="login" style="text-align:left">
    <h2 style="font-size:24px;text-align:center">Réglages</h2>
    <div class="grp"><h4>Organisation des créneaux</h4>
      <div class="field"><label>Capacité : nombre de crêpes possibles par tranche de 10 min</label><input type="number" min="1" max="20" id="cCap" value="${c.cap}"></div>
      <h4 style="margin-top:16px">Horaires d'ouverture</h4>
      <p style="color:var(--muted);font-size:13px;margin-bottom:6px">Format : <b>12:00-14:00 / 17:00-23:00</b>. Minuit = <b>24:00</b>. Laisser vide ou écrire <b>fermé</b> si fermé.</p>
      ${[1,2,3,4,5,6,0].map(i=>`<div class="field"><label>${cap1(JOURS[i])}</label><input type="text" id="h${i}" value="${esc(((c.hours||DEF_HOURS)[i]||[]).map(r=>r.join('-')).join(' / '))}" placeholder="fermé"></div>`).join('')}
      <button class="primary" style="width:100%;margin-top:12px" onclick="saveCfg()">Enregistrer l'organisation</button></div>
    <div class="grp"><h4>Changer le code PIN</h4>
      <div class="field"><label>Code PIN actuel</label><input type="password" inputmode="numeric" maxlength="4" autocomplete="off" id="p0"></div>
      <div class="row2"><div class="field"><label>Nouveau code</label><input type="password" inputmode="numeric" maxlength="4" autocomplete="off" id="p1"></div>
      <div class="field"><label>Confirmer</label><input type="password" inputmode="numeric" maxlength="4" autocomplete="off" id="p2"></div></div>
      <div class="err" id="pErr"></div>
      <button class="primary" style="width:100%;margin-top:6px" onclick="savePin()">Changer le code PIN</button>
      <p style="color:var(--muted);font-size:12px;margin-top:8px">Les autres appareils connectés devront retaper le nouveau code. Code oublié ? Sur Netlify, modifie la variable <b>ADMIN_PIN</b> puis redéploie : ce code redevient le code d'accès.</p></div>
    <button class="ghost" style="margin-top:16px;width:100%" onclick="drawDash()">← Retour aux commandes</button></div>`;
}
function parseRanges(txt){
  txt=(txt||'').trim().toLowerCase(); if(!txt||txt.startsWith('ferm'))return [];
  const norm=x=>{const m=x.trim().replace(/h$/,'').replace('h',':').match(/^(\d{1,2})(?::(\d{2}))?$/); if(!m)return null; let h=+m[1],mi=m[2]?+m[2]:0; if(h===0&&mi===0)h=24; return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')};
  return txt.split(/[\/,;]+/).map(p=>{const [a,b]=p.split(/[-–]/);const o=norm(a||''),c=norm(b||'');return o&&c?[o,c]:null});
}
async function savePin(){
  const cur=$('#p0').value, n=$('#p1').value, c=$('#p2').value, e=$('#pErr'); e.textContent='';
  if(!/^\d{4}$/.test(cur)) return e.textContent='Tape ton code actuel (4 chiffres).';
  if(!/^\d{4}$/.test(n)) return e.textContent='Le nouveau code doit faire 4 chiffres.';
  if(n!==c) return e.textContent='Les deux nouveaux codes ne correspondent pas.';
  const stay=(()=>{try{return !!localStorage.getItem(TOKEN_KEY)}catch(x){return false}})();
  try{
    const r=await api('/gerant/pin',{method:'POST',auth:true,body:{current:cur,next:n,stay}});
    try{ (stay?localStorage:sessionStorage).setItem(TOKEN_KEY,r.token) }catch(x){}
    ['#p0','#p1','#p2'].forEach(s=>$(s).value=''); toast('Code PIN changé ✓');
  }catch(err){ if(err.status===401&&/connecté/i.test(err.message))return logout(); e.textContent=err.message }
}
async function saveCfg(){
  const hours={};
  for(const i of [0,1,2,3,4,5,6]){ const r=parseRanges($('#h'+i).value); if(r.includes(null)){toast('Horaire invalide pour '+JOURS[i]);return} hours[i]=r }
  try{ const r=await api('/gerant/reglages',{method:'POST',auth:true,body:{cap:$('#cCap').value,hours}}); CFG=r.cfg; toast('Organisation enregistrée ✓') }
  catch(e){ if(e.status===401)logout(); else toast(e.message) }
}
